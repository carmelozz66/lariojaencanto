<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mapa de rutas · {{ site.nombre }}</title>
  <meta name="theme-color" content="#2f5d3a">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="assets/fonts.css">
  <link rel="stylesheet" href="assets/vendor/leaflet.css?v={{ ver }}">
  <link rel="stylesheet" href="assets/style.css?v={{ ver }}">
</head>
<body>
  <div class="viewer" id="mapfull">
    <div class="viewer-bar">
      <b>Todas las rutas</b>
      <span class="viewer-tools">
        <a class="pill" href="index.html" id="mapfull-ficha">Ir a la web</a>
        <button type="button" class="pill v-close" aria-label="Cerrar mapa">Cerrar ✕</button>
      </span>
    </div>
    <div id="mapfull-map" data-general="1"></div>
  </div>
  <script>window.RUTAS_MAPA = {{ mapa|tojson }};</script>
  <script src="assets/vendor/leaflet.js?v={{ ver }}"></script>
  <script src="assets/main.js?v={{ ver }}"></script>
</body>
</html>
