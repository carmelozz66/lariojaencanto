<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mapa · {{ r.titulo }} · {{ site.nombre }}</title>
  <meta name="theme-color" content="#2f5d3a">
  <link rel="icon" href="{{ base }}assets/favicon.svg" type="image/svg+xml">
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="{{ base }}assets/fonts.css">
  <link rel="stylesheet" href="{{ base }}assets/vendor/leaflet.css?v={{ ver }}">
  <link rel="stylesheet" href="{{ base }}assets/style.css?v={{ ver }}">
</head>
<body>
  <div class="viewer" id="mapfull">
    <div class="viewer-bar">
      <b>{{ r.titulo }}</b>
      <span class="viewer-tools">
        <a class="pill" href="{{ r.slug }}.html" id="mapfull-ficha">Ver la ficha</a>
        <button type="button" class="pill v-close" aria-label="Cerrar mapa">Cerrar ✕</button>
      </span>
    </div>
    <div id="mapfull-map" data-page="1"></div>
  </div>
  <script type="application/json" id="track-data">{{ r.track.puntos|tojson }}</script>
  <script src="{{ base }}assets/vendor/leaflet.js?v={{ ver }}"></script>
  <script src="{{ base }}assets/main.js?v={{ ver }}"></script>
</body>
</html>
